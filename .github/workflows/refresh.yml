name: Weekly data refresh

on:
  schedule:
    # 06:00 UTC every Wednesday — after midweek fixtures, before the weekend.
    - cron: "0 6 * * 3"
  workflow_dispatch:        # lets you trigger a refresh by hand

# Explicit write permission so the job can commit refreshed data back.
# Setting it here is more robust than relying on a repo-level setting that
# is easy to forget when the repo is cloned or transferred.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Completed seasons never change, so caching the raw CSVs means only
      # the current season is re-downloaded each week.
      - name: Restore CSV cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: fdcouk-${{ github.run_id }}
          restore-keys: fdcouk-

      - name: Refresh data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m plfc.ingest

      # Settle last week's forecasts against real results, then log new ones
      # for the coming fixtures. Runs in GitHub's cloud, so it happens whether
      # or not any laptop is switched on.
      - name: Update prediction ledger
        run: python -m plfc.ledger

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: weekly data refresh $(date -u +%Y-%m-%d)"
          git push